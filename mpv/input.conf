# Vim-style seeking and volume control
h seek -5
l seek 5
j add volume -5
k add volume 5

# Mouse wheel volume control
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2

#Open file
ctrl+o script-binding uosc/open-file

# Familiar player shortcuts and a right-click menu
MBTN_RIGHT script-binding uosc/menu
MBTN_LEFT_DBL cycle fullscreen
ctrl+p script-binding uosc/items
F11 cycle fullscreen

# Track pickers and clipboard URLs
alt+s script-binding uosc/subtitles
alt+a script-binding uosc/audio
ctrl+v script-binding uosc/paste-to-open
