# Playback and window behavior
hwdec=auto
save-position-on-quit=yes
keep-open=yes
force-window=yes
idle=yes
autofit-larger=85%x85%

# uosc provides the title bar, transport controls and seek bar.
osc=no
osd-bar=no
border=no
title=${media-title}
osd-font=Noto Sans
cursor-autohide=2000

# Streaming: limit the default quality; override in uosc's Stream quality menu.
ytdl-format=bestvideo[height<=?1080]+bestaudio/best[height<=?1080]
# Network streams use the cache automatically; limits are ceilings, not allocations.
cache=auto
cache-secs=120
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=32MiB
cache-pause=yes
cache-pause-initial=yes
cache-pause-wait=5
