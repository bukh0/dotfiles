# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      FONTS                                                       ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.7
disable_ligatures never

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      CURSOR & SHELL INTEGRATION                                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

cursor_shape beam
cursor_blink_interval 0.5
cursor_underline_thickness 4.0
cursor_stop_blinking_after 2.0

# 🚀 CURSOR TRAIL (Neovide Style)
cursor_trail 10
cursor_trail_decay 0.15 0.4
cursor_trail_start_threshold 2

shell_integration no-cursor

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      WINDOW & AESTHETICS                                         ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

hide_window_decorations yes
# Lower opacity to allow the background to show through (0.7 to 0.85 is usually the sweet spot)
background_opacity 0.77

# Allow opacity to be changed at runtime (ctrl+shift+a then m/l to raise/lower)
dynamic_background_opacity yes

confirm_os_window_close 0
input_delay 0

# Scrollback — default 2000 lines will silently cut off older output,
# and truncates what `get-text --extent=all` (copy-all) can grab.
scrollback_lines 10000

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      TABS (Powerline Style)                                      ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol ⚡

active_tab_font_style   bold
inactive_tab_font_style normal

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      REMOTE CONTROL                                              ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Needed for remote control commands
allow_remote_control yes

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      KEYBINDINGS                                                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Copy full scrollback (Using Kitty's native clipboard integration)
map ctrl+shift+a launch --stdin-source=@screen_scrollback --type=clipboard

# Copy the output of the *last* command directly to the clipboard
map ctrl+shift+y launch --stdin-source=@last_cmd_output --type=clipboard

# Open a pager to inspect/select from the *last* command's output
map ctrl+shift+g show_last_command_output

# ✨ Use kitten hints to visually select which command's output to copy
map ctrl+shift+o kitten hints --type command_output

map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃      THEME & COLORS                                              ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

include theme.conf
# current-theme.conf is unused — theme.switcher.sh only ever writes to theme.conf
# BEGIN_KITTY_THEME
# Base4Tone_Modern_W Dark
# END_KITTY_THEME
